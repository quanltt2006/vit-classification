# Cấu hình Model
model:
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  num_classes: 37

# Cấu hình Dữ liệu
data:
  batch_size: 32
  num_workers: 2

# Cấu hình Training
train:
  lr: 0.0001
  weight_decay: 0.05
  epochs: 50
  device: "cuda" # hoặc "cpu"
  checkpoint_dir: "checkpoints"