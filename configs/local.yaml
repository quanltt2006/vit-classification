exp_name: "vit_experiment_1"

# Cấu hình Model
model:
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  num_classes: 37

# Cấu hình Dữ liệu
data:
  batch_size: 32
  num_workers: 2
  val_split: 0.1   # 10% của trainval dùng làm validation

# Cấu hình Training
train:
  lr: 0.0001
  weight_decay: 0.05
  epochs: 1
  device: "cpu"   # hoặc "cpu"
  checkpoint_dir: "checkpoints"
  patience: 5      # early stopping: dừng nếu val_acc không cải thiện sau N epoch
  scheduler:
    type: "cosine"   # "cosine" | "step" | "none"
    step_size: 10    # chỉ dùng khi type = step
    gamma: 0.1       # chỉ dùng khi type = step
